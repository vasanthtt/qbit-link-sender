<!DOCTYPE html>
<html>
<head>
    <title>Qbit Link Sender Options</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 300px; padding: 5px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; margin-top: 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>qBittorrent API Settings</h2>
    <p>Enter the credentials for your qBittorrent Web UI. **Remember to disable CSRF protection in qBittorrent settings.**</p>

    <label for="host">Host URL (e.g., http://localhost:8080):</label>
    <input type="text" id="host">

    <label for="username">Username:</label>
    <input type="text" id="username">

    <label for="password">Password:</label>
    <input type="password" id="password">

    <button id="save">Save Credentials</button>
    <div id="status"></div>

    <script src="options.js"></script>
</body>
</html>
